name: Android CI & Build Debug APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK 35 & Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          sudo mkdir -p "$SDK_DIR/licenses"
          sudo chmod -R 777 "$SDK_DIR"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$SDK_DIR/licenses/android-sdk-preview-license"
          printf "\n601085b94cd77f0b54ff86406957099ebe79c4d6\n" > "$SDK_DIR/licenses/android-googletv-license"
          printf "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "$SDK_DIR/licenses/google-gdk-license"
          if [ ! -d "$SDK_DIR/platforms/android-35" ] || [ ! -d "$SDK_DIR/build-tools/35.0.0" ]; then
            SDKMANAGER=$(find "$SDK_DIR" -name sdkmanager -type f | head -n 1)
            if [ -n "$SDKMANAGER" ]; then
              yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-35" "build-tools;35.0.0" || true
            fi
          fi

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          validate-wrappers: false

      - name: Normalize Build Files for Public Maven on GitHub Actions
        run: |
          python3 - << 'EOF'
          import pathlib, re

          # 1. Normalize gradle-wrapper.properties to public Gradle 8.11.1
          wrapper_props = pathlib.Path("gradle/wrapper/gradle-wrapper.properties")
          if wrapper_props.exists():
              txt = wrapper_props.read_text(encoding="utf-8")
              txt = re.sub(r"gradle-[0-9.]+-bin\.zip", "gradle-8.11.1-bin.zip", txt)
              wrapper_props.write_text(txt, encoding="utf-8")

          # 2. Normalize settings.gradle.kts foojay plugin version & repositories for public Maven
          settings_path = pathlib.Path("settings.gradle.kts")
          if settings_path.exists():
              st = settings_path.read_text(encoding="utf-8")
              st = st.replace(
                  'id("org.gradle.toolchains.foojay-resolver-convention") version "1.0.0"',
                  'id("org.gradle.toolchains.foojay-resolver-convention") version "0.8.0"'
              )
              settings_path.write_text(st, encoding="utf-8")

          # 3. Normalize gradle/libs.versions.toml to a cohesive Kotlin 2.0.21 + AGP 8.7.3 + SDK 35 release train
          toml_path = pathlib.Path("gradle/libs.versions.toml")
          toml = toml_path.read_text(encoding="utf-8")
          replacements = {
              'agp = "9.1.1"': 'agp = "8.7.3"',
              'coreKtx = "1.18.0"': 'coreKtx = "1.15.0"',
              'junitVersion = "1.3.0"': 'junitVersion = "1.2.1"',
              'espressoCore = "3.7.0"': 'espressoCore = "3.6.1"',
              'activityCompose = "1.10.1"': 'activityCompose = "1.9.3"',
              'kotlin = "2.2.10"': 'kotlin = "2.0.21"',
              'googleDevtoolsKsp = "2.3.5"': 'googleDevtoolsKsp = "2.0.21-1.0.28"',
              'navigationCompose = "2.8.9"': 'navigationCompose = "2.8.5"',
              'roomRuntime = "2.7.0"': 'roomRuntime = "2.6.1"',
              'roomKtx = "2.7.0"': 'roomKtx = "2.6.1"',
              'roomCompiler = "2.7.0"': 'roomCompiler = "2.6.1"',
              'kotlinxCoroutinesTest = "1.10.2"': 'kotlinxCoroutinesTest = "1.9.0"',
              'kotlinxCoroutinesAndroid = "1.10.2"': 'kotlinxCoroutinesAndroid = "1.9.0"',
              'kotlinxCoroutinesCore = "1.10.2"': 'kotlinxCoroutinesCore = "1.9.0"',
              'accompanistPermissions = "0.37.3"': 'accompanistPermissions = "0.36.0"',
              'cameraCamera2 = "1.5.0"': 'cameraCamera2 = "1.4.1"',
              'cameraLifecycle = "1.5.0"': 'cameraLifecycle = "1.4.1"',
              'cameraView = "1.5.0"': 'cameraView = "1.4.1"',
              'cameraCore = "1.5.0"': 'cameraCore = "1.4.1"',
              'datastorePreferences = "1.1.7"': 'datastorePreferences = "1.1.1"',
              'retrofit = "2.12.0"': 'retrofit = "2.11.0"',
              'converterMoshi = "2.12.0"': 'converterMoshi = "2.11.0"',
              'robolectric = "4.16.1"': 'robolectric = "4.14.1"',
              'firebaseBom = "34.17.0"': 'firebaseBom = "33.7.0"',
              'googleServices = "4.5.0"': 'googleServices = "4.4.2"',
              'credentials = "1.5.0"': 'credentials = "1.3.0"',
          }
          for old, new in replacements.items():
              toml = toml.replace(old, new)
          if "kotlin-android =" not in toml:
              toml = toml.replace(
                  '[plugins]\n',
                  '[plugins]\nkotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }\n'
              )
          toml_path.write_text(toml, encoding="utf-8")

          # 4. Normalize root build.gradle.kts for AGP 8.7.3 + kotlin-android
          root_gradle = pathlib.Path("build.gradle.kts")
          rg = root_gradle.read_text(encoding="utf-8")
          if "libs.plugins.kotlin.android" not in rg:
              rg = rg.replace(
                  "alias(libs.plugins.android.application) apply false",
                  "alias(libs.plugins.android.application) apply false\n  alias(libs.plugins.kotlin.android) apply false"
              )
          if not pathlib.Path("app/google-services.json").exists():
              rg = rg.replace("alias(libs.plugins.google.services) apply false", "// alias(libs.plugins.google.services) apply false")
          root_gradle.write_text(rg, encoding="utf-8")

          # 5. Normalize app/build.gradle.kts for public AGP 8.7.3, SDK 35, KSP & JDK 21 Robolectric
          app_gradle = pathlib.Path("app/build.gradle.kts")
          ag = app_gradle.read_text(encoding="utf-8")
          ag = ag.replace(
              "import com.google.gms.googleservices.GoogleServicesPlugin.MissingGoogleServicesStrategy\n",
              ""
          )
          if "libs.plugins.kotlin.android" not in ag:
              ag = ag.replace(
                  "alias(libs.plugins.android.application)",
                  "alias(libs.plugins.android.application)\n  alias(libs.plugins.kotlin.android)"
              )
          if not pathlib.Path("app/google-services.json").exists():
              ag = ag.replace("alias(libs.plugins.google.services)", "// alias(libs.plugins.google.services)")
              ag = ag.replace(
                  "googleServices { missingGoogleServicesStrategy = MissingGoogleServicesStrategy.WARN }",
                  "// googleServices passthrough not needed when plugin is disabled"
              )
          ag = ag.replace(
              "compileSdk { version = release(36) { minorApiLevel = 1 } }",
              "compileSdk = 35"
          )
          ag = ag.replace("targetSdk = 36", "targetSdk = 35")
          if "kotlinOptions" not in ag:
              ag = ag.replace(
                  "compileOptions {\n    sourceCompatibility = JavaVersion.VERSION_11\n    targetCompatibility = JavaVersion.VERSION_11\n  }",
                  "compileOptions {\n    sourceCompatibility = JavaVersion.VERSION_11\n    targetCompatibility = JavaVersion.VERSION_11\n  }\n  kotlinOptions {\n    jvmTarget = \"11\"\n  }"
              )
          ag = ag.replace(
              '  "ksp"(libs.moshi.kotlin.codegen)',
              '  // "ksp"(libs.moshi.kotlin.codegen)'
          )
          ag = ag.replace(
              "testOptions { unitTests { isIncludeAndroidResources = true } }",
              """testOptions {
    unitTests {
      isIncludeAndroidResources = true
      isReturnDefaultValues = true
      all {
        it.jvmArgs(
          "-Xmx2g",
          "--add-opens=java.base/java.lang=ALL-UNNAMED",
          "--add-opens=java.base/java.lang.reflect=ALL-UNNAMED",
          "--add-opens=java.base/java.io=ALL-UNNAMED",
          "--add-opens=java.base/java.net=ALL-UNNAMED",
          "--add-opens=java.base/java.util=ALL-UNNAMED",
          "--add-opens=java.base/java.text=ALL-UNNAMED",
          "--add-opens=java.base/java.security=ALL-UNNAMED"
        )
      }
    }
  }"""
          )
          app_gradle.write_text(ag, encoding="utf-8")

          # 6. Normalize Robolectric @Config(sdk = [35]) to @Config(sdk = [34]) for Robolectric 4.14.1 on CI
          for test_file in pathlib.Path("app/src/test").rglob("*.kt"):
              content = test_file.read_text(encoding="utf-8")
              content = content.replace("@Config(sdk = [35])", "@Config(sdk = [34])")
              test_file.write_text(content, encoding="utf-8")

          # 7. Normalize gradle.properties for standard Gradle + KSP execution on CI
          gp_path = pathlib.Path("gradle.properties")
          if gp_path.exists():
              gp = gp_path.read_text(encoding="utf-8")
              gp = gp.replace("kotlin.compiler.execution.strategy=in-process", "# kotlin.compiler.execution.strategy=in-process")
              gp = gp.replace("org.gradle.configuration-cache=true", "org.gradle.configuration-cache=false")
              gp_path.write_text(gp, encoding="utf-8")
          EOF

      - name: Prepare Binary Assets, Font & Debug Keystore
        run: |
          # 1. Generate Gradle Wrapper files if missing from text-only push
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.11.1 --no-daemon
          fi
          chmod +x ./gradlew

          # 2. Ensure both .env.example and .env exist for Secrets Gradle Plugin
          if [ ! -f .env.example ]; then
            printf "# Environment variables and API keys configuration\n" > .env.example
          fi
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          # 3. Ensure Cairo font exists (in case binary .ttf was skipped during push)
          mkdir -p app/src/main/res/font
          if [ ! -s app/src/main/res/font/cairo.ttf ]; then
            curl -f -L -s "https://fonts.gstatic.com/s/cairo/v31/SLXgc1nY6HkvangtZmpQdkhzfH5lkSs2SgRjCAGMQ1z0hOA-a1PiKQ.ttf" -o app/src/main/res/font/cairo.ttf
          fi

          # 4. Ensure valid PNG launcher icons exist in mipmap folders (pure Python3, zero external tools needed)
          python3 - << 'EOF'
          import os, struct, zlib, math

          def write_png(path, size, circular=False):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              raw = bytearray()
              cx = cy = (size - 1) / 2.0
              r_max = size / 2.0
              for y in range(size):
                  raw.append(0)
                  for x in range(size):
                      if circular and math.hypot(x - cx, y - cy) > r_max:
                          raw.extend((0, 0, 0, 0))
                      else:
                          nx, ny = x / size, y / size
                          if 0.28 <= nx <= 0.72 and 0.22 <= ny <= 0.78:
                              raw.extend((165, 180, 252, 255))
                          else:
                              raw.extend((30 + int(19 * ny), 27 + int(19 * ny), 75 + int(54 * ny), 255))
              def chunk(tag, data):
                  return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data) & 0xffffffff)
              ihdr = struct.pack("!IIBBBBB", size, size, 8, 6, 0, 0, 0)
              png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(bytes(raw), 9)) + chunk(b"IEND", b"")
              with open(path, "wb") as f:
                  f.write(png)

          densities = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for d, sz in densities.items():
              folder = f"app/src/main/res/mipmap-{d}"
              os.makedirs(folder, exist_ok=True)
              for webp in ("ic_launcher.webp", "ic_launcher_round.webp"):
                  wp = os.path.join(folder, webp)
                  if os.path.exists(wp):
                      os.remove(wp)
              p1 = os.path.join(folder, "ic_launcher.png")
              p2 = os.path.join(folder, "ic_launcher_round.png")
              if not os.path.exists(p1) or os.path.getsize(p1) < 64:
                  write_png(p1, sz, circular=False)
              if not os.path.exists(p2) or os.path.getsize(p2) < 64:
                  write_png(p2, sz, circular=True)
          EOF

          # 5. Generate standard Android debug.keystore required by app/build.gradle.kts
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK Output Exists
        run: ls -lh app/build/outputs/apk/debug/*.apk

      - name: Upload Debug APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MangaReader-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
